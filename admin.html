<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxeStore - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#f8faf9] text-slate-900 font-sans antialiased min-h-screen">

    <!-- OVERLAY LOGIN (Sederhana & Tanpa Error Auth) -->
    <div id="login-modal" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 max-w-sm w-full rounded-3xl p-6 shadow-2xl space-y-5 text-white">
            <div class="text-center space-y-1">
                <div class="w-12 h-12 bg-emerald-500 rounded-2xl mx-auto flex items-center justify-center font-black text-2xl">L</div>
                <h2 class="text-xl font-extrabold pt-2">Login Merchant Admin</h2>
                <p class="text-xs text-slate-400">Masukkan Email & Password Admin</p>
            </div>

            <form onsubmit="handleSimpleLogin(event)" class="space-y-3">
                <div>
                    <label class="text-[10px] font-mono font-bold text-slate-400 uppercase">Email Admin</label>
                    <input id="login-email" required type="email" value="admin@luxestore.com" class="w-full mt-1 p-3 bg-slate-900 text-white rounded-xl border border-slate-700 text-xs focus:outline-none focus:border-emerald-500"/>
                </div>
                <div>
                    <label class="text-[10px] font-mono font-bold text-slate-400 uppercase">Password</label>
                    <input id="login-password" required type="password" value="admin123" class="w-full mt-1 p-3 bg-slate-900 text-white rounded-xl border border-slate-700 text-xs focus:outline-none focus:border-emerald-500"/>
                </div>
                <div id="login-error" class="text-red-400 text-xs hidden text-center">Email / Password salah!</div>
                <button type="submit" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 font-bold text-xs rounded-xl transition-all shadow-md">
                    Masuk ke Dashboard
                </button>
            </form>
        </div>
    </div>

    <!-- DASHBOARD ADMIN UTAMA -->
    <div id="admin-dashboard-view" class="hidden min-h-screen flex flex-col md:flex-row">
        <!-- SIDEBAR -->
        <aside class="w-full md:w-64 bg-slate-900 text-white shrink-0 p-6 flex flex-col justify-between border-r border-slate-800">
            <div class="space-y-8">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center text-white font-black text-xl">L</div>
                    <div>
                        <h2 class="font-extrabold text-sm tracking-wide">Merchant Central</h2>
                        <p class="text-[10px] text-slate-400">Admin Mode</p>
                    </div>
                </div>

                <nav class="space-y-2 text-xs">
                    <button onclick="switchTab('overview')" id="btn-tab-overview" class="w-full text-left px-4 py-3 rounded-xl bg-emerald-500 font-bold flex items-center gap-3">
                        <span class="material-symbols-outlined text-base">dashboard</span> Ringkasan
                    </button>
                    <button onclick="switchTab('products')" id="btn-tab-products" class="w-full text-left px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 flex items-center gap-3">
                        <span class="material-symbols-outlined text-base">inventory_2</span> Kelola Produk
                    </button>
                    <button onclick="switchTab('orders')" id="btn-tab-orders" class="w-full text-left px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 flex items-center gap-3">
                        <span class="material-symbols-outlined text-base">shopping_cart</span> Pesanan Masuk
                    </button>
                </nav>
            </div>

            <button onclick="logout()" class="w-full text-left px-4 py-2.5 rounded-xl text-red-400 hover:bg-red-500/10 font-bold text-xs flex items-center gap-2 mt-6">
                <span class="material-symbols-outlined text-base">logout</span> Logout
            </button>
        </aside>

        <!-- KONTEN -->
        <main class="flex-1 p-6 lg:p-8 space-y-6 overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-4 border-slate-200">
                <h1 class="text-xl font-bold" id="page-title">Ringkasan Performa</h1>
                <button onclick="openModal()" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold rounded-xl flex items-center gap-2">
                    <span class="material-symbols-outlined text-base">add</span> Tambah Produk
                </button>
            </div>

            <!-- SECTION OVERVIEW -->
            <div id="sec-overview" class="space-y-6">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="bg-white p-4 rounded-2xl border border-slate-200">
                        <span class="text-[10px] text-slate-400 font-bold uppercase">Total Produk</span>
                        <h3 class="text-2xl font-black text-slate-800 mt-1" id="stat-products">0</h3>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-slate-200">
                        <span class="text-[10px] text-slate-400 font-bold uppercase">Total Pesanan</span>
                        <h3 class="text-2xl font-black text-slate-800 mt-1" id="stat-orders">0</h3>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-slate-200">
                        <span class="text-[10px] text-slate-400 font-bold uppercase">Total Pendapatan</span>
                        <h3 class="text-2xl font-black text-emerald-600 mt-1" id="stat-revenue">$0.00</h3>
                    </div>
                </div>
            </div>

            <!-- SECTION PRODUCTS -->
            <div id="sec-products" class="hidden">
                <div class="bg-white rounded-2xl border border-slate-200 p-4">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-50 border-b text-slate-500">
                            <tr><th class="p-3">PRODUK</th><th class="p-3">HARGA</th><th class="p-3">STOK</th><th class="p-3">AKSI</th></tr>
                        </thead>
                        <tbody id="table-products" class="divide-y"></tbody>
                    </table>
                </div>
            </div>

            <!-- SECTION ORDERS -->
            <div id="sec-orders" class="hidden">
                <div class="bg-white rounded-2xl border border-slate-200 p-4">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-50 border-b text-slate-500">
                            <tr><th class="p-3">ID</th><th class="p-3">PELANGGAN</th><th class="p-3">TOTAL</th><th class="p-3">STATUS</th></tr>
                        </thead>
                        <tbody id="table-orders" class="divide-y"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL PRODUK -->
    <div id="product-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 max-w-md w-full rounded-2xl p-6 text-white space-y-4">
            <h3 class="font-bold text-sm">Form Tambah Produk</h3>
            <form onsubmit="saveProduct(event)" class="space-y-3">
                <input required id="p-title" type="text" placeholder="Nama Produk" class="w-full p-2.5 bg-slate-800 rounded-xl border border-slate-700 text-xs"/>
                <input required id="p-price" type="number" step="0.01" placeholder="Harga ($)" class="w-full p-2.5 bg-slate-800 rounded-xl border border-slate-700 text-xs"/>
                <input required id="p-stock" type="number" placeholder="Jumlah Stok" class="w-full p-2.5 bg-slate-800 rounded-xl border border-slate-700 text-xs"/>
                <input required id="p-img" type="text" placeholder="URL Gambar" class="w-full p-2.5 bg-slate-800 rounded-xl border border-slate-700 text-xs"/>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="w-1/2 py-2 bg-slate-700 rounded-xl text-xs font-bold">Batal</button>
                    <button type="submit" class="w-1/2 py-2 bg-emerald-500 rounded-xl text-xs font-bold">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Supabase Client Setup (Pakai Project URL & Anon Key Kamu)
        const SUPABASE_URL = 'https://mmpufzzhumzgtkbsuuik.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_KZNxfS-6dYP4X1I16YLoAA_UeUPEcit'; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let products = [], orders = [];

        // Cek Login Lokal (Simple & Bebas Error Auth Supabase)
        window.onload = () => {
            if(localStorage.getItem('is_admin_logged') === 'true') {
                showDashboard();
            }
        };

        function handleSimpleLogin(e) {
            e.preventDefault();
            const em = document.getElementById('login-email').value;
            const pw = document.getElementById('login-password').value;

            // Login Admin bawaan sederhana
            if(em === 'admin@luxestore.com' && pw === 'admin123') {
                localStorage.setItem('is_admin_logged', 'true');
                showDashboard();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('is_admin_logged');
            window.location.reload();
        }

        function showDashboard() {
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('admin-dashboard-view').classList.remove('hidden');
            fetchData();
        }

        async function fetchData() {
            // Load Products
            const resP = await supabase.from('products').select('*').order('id', {ascending: false});
            products = resP.data || [];

            // Load Orders
            const resO = await supabase.from('orders').select('*').order('created_at', {ascending: false});
            orders = resO.data || [];

            render();
        }

        function render() {
            document.getElementById('stat-products').innerText = products.length;
            document.getElementById('stat-orders').innerText = orders.length;
            
            const rev = orders.reduce((s, o) => s + (parseFloat(o.total_amount) || 0), 0);
            document.getElementById('stat-revenue').innerText = `$${rev.toFixed(2)}`;

            // Render Products Table
            const pBody = document.getElementById('table-products');
            pBody.innerHTML = products.map(p => `
                <tr>
                    <td class="p-3 flex items-center gap-2"><img src="${p.image}" class="w-8 h-8 rounded object-cover"/> <b>${p.title}</b></td>
                    <td class="p-3">$${p.price}</td>
                    <td class="p-3">${p.stock}</td>
                    <td class="p-3"><button onclick="deleteProduct(${p.id})" class="text-red-500 font-bold">Hapus</button></td>
                </tr>
            `).join('');

            // Render Orders Table
            const oBody = document.getElementById('table-orders');
            oBody.innerHTML = orders.map(o => `
                <tr>
                    <td class="p-3 font-bold">#${o.id}</td>
                    <td class="p-3">${o.customer_name || 'Pelanggan'}</td>
                    <td class="p-3 text-emerald-600 font-bold">$${o.total_amount || 0}</td>
                    <td class="p-3 font-bold text-amber-600">${o.status || 'DIPROSES'}</td>
                </tr>
            `).join('');
        }

        async function saveProduct(e) {
            e.preventDefault();
            const newP = {
                title: document.getElementById('p-title').value,
                price: parseFloat(document.getElementById('p-price').value),
                stock: parseInt(document.getElementById('p-stock').value),
                image: document.getElementById('p-img').value
            };

            await supabase.from('products').insert([newP]);
            closeModal();
            fetchData();
        }

        async function deleteProduct(id) {
            if(confirm('Hapus produk ini?')) {
                await supabase.from('products').delete().eq('id', id);
                fetchData();
            }
        }

        function switchTab(t) {
            document.getElementById('sec-overview').classList.add('hidden');
            document.getElementById('sec-products').classList.add('hidden');
            document.getElementById('sec-orders').classList.add('hidden');
            document.getElementById('sec-' + t).classList.remove('hidden');
        }

        function openModal() { document.getElementById('product-modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('product-modal').classList.add('hidden'); }
    </script>
</body>
</html>
